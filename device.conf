# devices/akita/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device akita
	title       Pixel 8a
	vendor      Google
	soc         zuma
	defconfig   akita_defconfig
	maintainer  Hilledkinged
	status      display     partial   the bootloader's framebuffer (0xfac00000, 1080 x 2400), drawn in software by Darwin: ~10 frames a second
	status      touch       works     Goodix GT9895 on SPI (HSI0 USI2), polled; taps, swipes, the app switcher (CONFIG_HAKIOS_AKITA_TOUCH, touchscreen=1)
	status      buttons     works     power, volume up, volume down: the volume HUD, the screen locked and woken (CONFIG_HAKIOS_AKITA_KEYS, buttons=1)
	status      cpu         partial   8 of 9 cores (the X3 not used); no frequency control (ACPM's)
	status      usb         partial   the development link only: xl through U-Boot and the loader (44-46 MB/s); nothing for Darwin
	status      storage     works     Darwin runs from the flash (darwin, 77 GiB), /private/var kept between starts
	status      gpu         missing   Mali-G715: software drawing only
	status      battery     missing   behind the AoC and ACPM; the icon is empty, no charging while in HakiOS
	status      audio       missing   behind the AoC
	status      wifi        missing   Broadcom on PCIe
	status      cellular    missing   Samsung's modem
	status      thermal     missing   no throttling
