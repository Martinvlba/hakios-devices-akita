# devices/akita/device.conf: what this device repository is (docs/porting/repositories.md has every word).

device akita
	title       Pixel 8a
	vendor      Google
	soc         zuma
	defconfig   akita_defconfig
	maintainer  Hilledkinged
	status      display     partial   the bootloader's framebuffer (0xfac00000, 1080 x 2400) through U-Boot, DECON0's trigger unmasked; the kernel draws on it
	status      cpu         partial   one core: the kernel runs at EL1, started by the loader from EL2; hello ran and the kernel returned (2026-10-31)
	status      usb         missing   U-Boot has no driver for zuma's USB: no fastboot, no xl, the screen is the only output
	status      storage     missing   U-Boot has no driver for zuma's UFS
